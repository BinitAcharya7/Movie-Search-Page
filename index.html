<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="assets/film-reel.jpg">
    <title>Movie Info</title>
    <script src="https://kit.fontawesome.com/e247684d80.js" crossorigin="anonymous"></script>
</head>
<body>
    
 <header>
    <div class="hero">
        <h1>Search Movies</h1>
    </div>
    <div class="search-area">
            <input type="search" autofocus class = "search-bar" name = "q" placeholder = "Search any Movie" onkeydown="if (event.key == 'Enter')searchedTitle()">
            <div class="search-icon" onclick = "searchedTitle()">
            <i class="fa-solid fa-magnifying-glass"></i>
            </div>
        </div>
 </header>

<div class="slider-and-sort">
    <div class="filter">
        <div class="filter-slider"> <label for = "year-range" id = "filter-label">Year Range: </label>
            <input type = "range" id = "year-range" class = "slider" min = "1930" max = "2020"  oninput = "filterByYear(event)">
            <span id="slider-value">2020</span>
        </div>
    </div>
    <div class="sort" onchange="sortMovies(event)">
        <select id = "sort">
            <option value = "" disabled selected>Sort</option>
            <option value = "RATING">IMDb Rating</option>
            <option value = "LOW_TO_HIGH">Runtime (Low to High)</option>
            <option value = "HIGH_TO_LOW">Runtime (High to Low)</option>
        </select>
    </div>
</div>
<div class="featured-movies">
        <h1>Featured Movies</h1>
    </div>

<div class="movies-area"> <!--for the spinner as we can't add it to the place where innerhtml changes unless we add the icon in the actual changed place too### so the fa-spinner wont even exist if we directly add it to the innerhtml changing class-->
    <div id = "movies-list"><!--Injecting all JS rendered content here--></div>
    
    <!--in the loading state movies-loading class will be added here which will show the spinner before await comes back with the result.-->
     <i class="fas fa-spinner movies-loading-spinner"></i><!--movies-loading-spinner has display none until movies-loading class is addded so then the actual spinner finally shows which we've styled with the class that adds itself beforehand so just do display:block--> 
</div>

    <script src="movies.js"></script>
</body>
</html>
